name: Build NOYON HOSTING APK
on:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download developer icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -L --fail 'https://i.ibb.co/My6Mn3SL/1000015189.png' -o app/src/main/res/drawable-nodpi/developer_icon.png
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NOYON-HOSTING-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
